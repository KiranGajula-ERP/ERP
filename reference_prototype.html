/* Calm, polished visual refresh: clear links without underlines and soft eye-friendly surfaces */
a,a:visited,a:hover,a:focus{text-decoration:none!important}
.drill,.drill:hover,.metric-value,.project-row,.project-row:hover,.id{text-decoration:none!important}
.drill{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:5px 8px;background:#edf5ff;color:#1c67ad;transition:background .18s,transform .18s}
.drill:hover{background:#dcecff;transform:translateY(-1px)}
:root{--bg:#f4f7fb;--card:#ffffff;--line:#e2eaf3;--shadow:0 8px 26px rgba(28,55,90,.055)}
body{background:radial-gradient(ellipse at 78% 0%,#eaf3ff 0%,transparent 38%),var(--bg);color:#23364d}
.topbar{background:rgba(255,255,255,.94);backdrop-filter:blur(12px)}
.content{padding-top:30px}
.card{border-radius:16px;box-shadow:0 5px 20px rgba(25,55,91,.045);transition:box-shadow .18s,border-color .18s}
.card:hover{box-shadow:0 10px 28px rgba(25,55,91,.075)}
.kpi{position:relative;overflow:hidden;background:linear-gradient(145deg,#fff 0%,#fbfdff 100%);padding:19px;min-height:140px}
.kpi:after{content:"";position:absolute;right:-28px;top:-38px;width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#eaf3ff88,#eaf3ff00);pointer-events:none}
.kpiicon{box-shadow:0 3px 8px rgba(36,105,180,.08)}
.big{letter-spacing:-.55px;font-size:29px}
.metric-tile{border:1px solid #e2eaf3;border-radius:16px;box-shadow:0 5px 18px rgba(25,55,91,.04);background:linear-gradient(150deg,#fff,#fafdff)}
.metric-tile:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(25,75,130,.09)}
.metric-open{display:inline-flex;padding:4px 8px;border-radius:20px;background:#eef5ff;color:#286cb0}
.project-row{box-shadow:0 2px 8px rgba(25,55,91,.025);transition:background .16s,transform .16s,border-color .16s}
.project-row:hover{transform:translateY(-1px);border-color:#bfd8f5;background:#f8fbff}
th{background:#f5f8fc}
.tab.active{box-shadow:inset 0 0 0 1px #d5e7fb}
.btn,.pill,.iconbtn{transition:background .16s,border-color .16s,transform .16s}
.btn:hover,.iconbtn:hover{border-color:#b9d2ef;background:#f8fbff}
::selection{background:#d5e8ff;color:#12385e}
@media(max-width:900px){.content{padding:20px 16px 34px}.kpis{gap:12px}.kpi{padding:15px}.big{font-size:25px}}

/* Saffron accent theme: warm highlights balanced with calm navy and blue */
:root { --saffron: #E9A23B; --saffron-deep: #C77916; --saffron-soft: #FFF4DF; }
/* Keep saffron as an accent, not a large background, for comfortable long sessions. */
.sidebar .nav-item.active, .sidebar a.active, nav .active { border-left-color: var(--saffron) !important; }
button.primary, .btn-primary, .primary-button { background: linear-gradient(135deg, #F0B34D, #DF8F27) !important; border-color: #DF8F27 !important; color: #172B4D !important; }
button.primary:hover, .btn-primary:hover, .primary-button:hover { background: linear-gradient(135deg, #F4C36F, #E9A23B) !important; }
.kpi-card:hover, .metric-card:hover, .tile:hover, .stat-card:hover { border-color: #E9B45C !important; box-shadow: 0 8px 24px rgba(201, 128, 30, .10) !important; }
.accent, .saffron, .section-accent { color: var(--saffron-deep) !important; }
.badge-warning, .status-pending, .pill-pending { background: var(--saffron-soft) !important; color: #8A520D !important; border-color: #F0D29A !important; }
.progress-bar .saffron-fill, .progress-saffron { background: linear-gradient(90deg, #F2C36F, #E49A32) !important; }
:focus-visible { outline: 3px solid rgba(233, 162, 59, .55); outline-offset: 2px; }

/* Light, warm sidebar refresh: replaces the dark navy menu with a soft ivory surface. */

.sidebar .workspace small{color:#9a6b2c !important}

.sidebar .navbtn{color:#526176 !important}
.sidebar .navbtn:hover{background:#fff1d6 !important;color:#243a56 !important}
.sidebar .navbtn.active{background:#ffedc7 !important;color:#6d430d !important;box-shadow:inset 3px 0 #e9a23b !important}
.sidebar .sidebarfoot{border-top-color:#eee1cf !important}
.sidebar .sidebarfoot small{color:#8791a0 !important}

/* Spreadsheet-style received stock register, matching the supplied reference. */

.stock-record-link{display:inline-block;border:0;background:transparent;color:#176fc6;text-decoration:underline;text-decoration-color:#a8cdf5;text-underline-offset:3px;padding:1px 2px;font:inherit;font-weight:700;cursor:pointer;white-space:normal}

.matrix-doc-links{display:flex;flex-wrap:wrap;gap:2px 6px;justify-content:center;max-width:180px;margin:auto}

.linked-record-panel{border:1px solid #d6e5f6;background:#f8fbff;border-radius:12px;padding:16px;margin-bottom:15px}

function auditsPage(){let filtered=audits.filter(a=>(state.auditFilter==='All'||a.status===state.auditFilter));return head('AUDIT OPERATIONS','Audit Management','Manage audits across every project, with a project-level overview and linked audit records.',`<button class="btn" data-action="audit-calendar">▦ Calendar</button><button class="btn primary" data-action="new-audit">＋ Create audit</button>`)+`<div class="grid kpis">${kpi('Total projects',projects.length,'Projects under audit coverage','▣',projects.map(p=>({name:p.code,detail:p.name,value:p.status,meta:p.city}))) }${kpi('Scheduled audits',audits.filter(a=>a.status==='Planned').length,'Across all projects','☷',audits.filter(a=>a.status==='Planned').map(a=>({name:a.id,detail:a.project,value:a.date,meta:a.type})))}${kpi('Open findings',findings.filter(f=>f.status!=='Closed').length,'Across all projects','⚑',findings.filter(f=>f.status!=='Closed').map(f=>({name:f.id,detail:f.title,value:f.status,meta:f.project})))}${kpi('Open exposure',money(findings.filter(f=>f.status!=='Closed').reduce((s,f)=>s+f.amount,0)),'Finding-linked value','₹',findings.filter(f=>f.status!=='Closed').map(f=>({name:f.id,detail:f.title,value:money(f.amount),meta:f.project})),'cost')}</div><div class="card panel" style="margin-bottom:16px"><div class="panelhead"><div><h2 class="paneltitle">All Project Audit Coverage</h2><div class="muted small">Project-wise audit counts, findings and direct access to each full Project Workspace.</div></div><button class="btn" data-go="projects">All project workspaces →</button></div>${table(['Project','Location / Manager','Audit Assignments','Open Findings','Project Status','Workspace'],projects.map(p=>{let pa=audits.filter(a=>a.project===p.name),pf=findings.filter(f=>f.project===p.name&&f.status!=='Closed');return `<tr><td><b>${p.name}</b><div class="muted small">${p.code}</div></td><td>${p.city}<div class="muted small">${p.manager}</div></td><td>${countBreak(pa.length,'Audit assignments — '+p.name,pa.map(a=>({name:a.id,detail:a.type,value:a.status,meta:a.date})))}</td><td>${countBreak(pf.length,'Open findings — '+p.name,pf.map(f=>({name:f.id,detail:f.title,value:f.status,meta:f.severity})))}</td><td>${statusTag(p.status)}</td><td><button class="btn" data-project-open="${p.name}">Open workspace →</button></td></tr>`} ))}</div><div class="grid kpis">${kpi('Planned',audits.filter(a=>a.status==='Planned').length,'Ready for assignment','◷',audits.filter(a=>a.status==='Planned').map(a=>({name:a.id,detail:a.project,value:a.date,meta:a.type})))}
${kpi('In progress',audits.filter(a=>a.status==='In Progress').length,'Auditor working','◉',audits.filter(a=>a.status==='In Progress').map(a=>({name:a.id,detail:a.project,value:a.auditor,meta:a.date})))}
${kpi('Submitted',audits.filter(a=>a.status==='Submitted').length,'Awaiting review','⇧',audits.filter(a=>a.status==='Submitted').map(a=>({name:a.id,detail:a.project,value:a.auditor,meta:a.date})))}
${kpi('Findings identified',audits.reduce((s,a)=>s+a.findings,0),'Across audit register','⚑',audits.map(a=>({name:a.id,detail:a.project,value:a.findings+' findings',meta:a.status})))}</div><div class="tabs">${['All','Planned','In Progress','Submitted','Reviewed'].map(s=>`<button class="tab ${state.auditFilter===s?'active':''}" data-audit-filter="${s}">${s} ${s==='All'?'('+audits.length+')':''}</button>`).join('')}</div><div class="card">${table(['Audit ID','Project','Audit type','Auditor','Visit date','Findings','Status','Action'],filtered.map(a=>`<tr><td><button class="drill" data-audit="${a.id}">${a.id}</button></td><td>${a.project}</td><td>${a.type}</td><td>${a.auditor}</td><td>${a.date}</td><td>${countBreak(a.findings,'Finding breakdown — '+a.id,findings.filter(f=>f.project===a.project).map(f=>({name:f.id,detail:f.title,value:f.severity,meta:f.status})))}</td><td>${statusTag(a.status)}</td><td><button class="btn" data-audit="${a.id}">Open</button></td></tr>`))}</div>`}
function materialsPage(){let list=stock.filter(s=>(s.item+' '+s.code+' '+s.project).toLowerCase().includes(state.stockSearch.toLowerCase()));let totalVariance=stock.reduce((s,x)=>s+x.value,0),shortages=stock.filter(s=>s.variance<0);return head('SITE CONTROLS','Material Audit','Reconcile book stock with physical stock and investigate variances.',`<button class="btn" data-action="stock-count">＋ Record physical count</button><button class="btn primary" data-action="material-export">Export reconciliation</button>`)+`<div class="grid kpis">${kpi('Materials checked',stock.length,'Across demo projects','▤',stock.map(s=>({name:s.code,detail:s.item,value:s.physical+' '+s.unit,meta:s.project})))}
${kpi('Variances',stock.filter(s=>s.variance!==0).length,'Require review','⚑',stock.filter(s=>s.variance!==0).map(s=>({name:s.code,detail:s.item,value:(s.variance>0?'+':'')+s.variance+' '+s.unit,meta:s.project})))}
${kpi('Shortage value',money(shortages.reduce((s,x)=>s+x.value,0)),'Based on illustrative rates','₹',shortages.map(s=>({name:s.code,detail:s.item,value:money(s.value),meta:s.project})),'cost')}
${kpi('Variance value',money(totalVariance),'Absolute variance valuation','₹',stock.filter(s=>s.variance!==0).map(s=>({name:s.code,detail:s.item,value:money(s.value),meta:(s.variance>0?'Excess':'Shortage')})),'cost')}</div><div class="callout">Formula: Expected stock = Opening + Receipts − Issues + Returns + Net adjustments. A variance should be investigated, not automatically written off.</div><div class="filters"><input class="field" id="stockSearch" placeholder="Search material, code or project…" value="${state.stockSearch}"></div><div class="card">${table(['Material / code','Project','Opening','Received','Issued','Expected','Physical','Variance','Variance value','Review'],list.map(s=>`<tr><td><b>${s.item}</b><div class="muted small">${s.code}</div></td><td>${s.project}</td><td>${num(s.opening)} ${s.unit}</td><td>${num(s.received)} ${s.unit}</td><td>${num(s.issued)} ${s.unit}</td><td>${num(s.expected)} ${s.unit}</td><td>${countBreak(num(s.physical)+' '+s.unit,'Physical stock breakdown — '+s.item,[{name:'Physical count',detail:'Auditor entered quantity',value:s.physical+' '+s.unit,meta:s.project},{name:'Count evidence',detail:'Site count sheet',value:'Demo reference',meta:'Not uploaded'}])}</td><td>${drill((s.variance>0?'+':'')+s.variance+' '+s.unit,'Variance breakdown — '+s.item,[{name:'Expected stock',detail:'Opening + receipts − issues + returns',value:s.expected+' '+s.unit,meta:'Calculated'},{name:'Physical stock',detail:'Counted at site',value:s.physical+' '+s.unit,meta:'Illustrative'},{name:'Variance',detail:'Physical − expected',value:s.variance+' '+s.unit,meta:s.variance===0?'Matched':s.variance<0?'Shortage':'Excess'}])}</td><td>${costBreak(money(s.value),'Variance valuation — '+s.item,[{name:'Variance quantity',detail:Math.abs(s.variance)+' '+s.unit,value:num(Math.abs(s.variance))+' × '+money(s.rate),meta:'Illustrative rate'},{name:'Rate per unit',detail:s.item,value:money(s.rate),meta:'Demo rate'},{name:'Estimated exposure',detail:'Absolute variance × rate',value:money(s.value),meta:'Not an accounting valuation'}])}</td><td><button class="btn" data-stock="${s.code}">Inspect</button></td></tr>`))}</div>`}
function documentsPage(){let list=docs.filter(d=>(state.docFilter==='All'||d.status===state.docFilter)&&(!state.docFocusId||d.id===state.docFocusId));const focusedDoc=state.docFocusId?docs.find(d=>d.id===state.docFocusId):null;const attached=focusedDoc?state.linkedDocAttachments[focusedDoc.id]:null;const focusedPanel=focusedDoc?`<div class="linked-record-panel"><div class="panelhead"><div><h2 class="paneltitle">${focusedDoc.type} · ${focusedDoc.id}</h2><p class="muted small">${focusedDoc.project} · ${focusedDoc.supplier} · ${focusedDoc.date}</p></div><span class="tag blue">${focusedDoc.status}</span></div><p class="muted small">Attach or open the physical / signed copy linked to this system document.</p><div class="linked-record-actions"><label class="btn" for="focusDocFile">Attach physical / signed copy</label><input id="focusDocFile" type="file" accept="application/pdf,image/*,.pdf" data-linked-file-key="${encodeURIComponent('doc:'+focusedDoc.id)}" style="display:none">${attached?`<span class="tag green">${attached.name}</span><button class="btn" data-open-linked-attachment="${encodeURIComponent('doc:'+focusedDoc.id)}">Open attachment ↗</button>`:'<span class="muted small">No file attached</span>'}</div></div>`:'';return (state.docFocusId?`<div class="notice" style="margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;align-items:center"><span>Filtered to linked document <b>${state.docFocusId}</b></span><button class="btn" data-clear-doc-focus>Clear filter</button></div>`:'')+focusedPanel+head('PROCUREMENT CONTROLS','Purchase & Bill Audit','Check document completeness, references, quantities and financial values.',`<button class="btn" data-action="document-check">＋ Add document check</button><button class="btn primary" data-action="document-import">Import register</button>`)+`<div class="grid kpis">${kpi('Documents checked',docs.length,'MR · PO · DC · MIR · GRN · bills','▧',docs.map(d=>({name:d.id,detail:d.type+' · '+d.project,value:d.status,meta:d.supplier})))}
${kpi('Pending review',docs.filter(d=>d.status==='Pending Review').length,'Need audit verification','◷',docs.filter(d=>d.status==='Pending Review').map(d=>({name:d.id,detail:d.type,value:d.project,meta:d.supplier})))}
${kpi('Document value',money(docs.reduce((s,d)=>s+d.amount,0)),'Illustrative referenced value','₹',docs.map(d=>({name:d.id,detail:d.type+' · '+d.project,value:money(d.amount),meta:d.status})),'cost')}
${kpi('Exceptions',docs.filter(d=>['Missing TDS','Variance'].includes(d.status)).length,'Missing data or mismatch','⚑',docs.filter(d=>['Missing TDS','Variance'].includes(d.status)).map(d=>({name:d.id,detail:d.type,value:d.status,meta:d.project})))}</div><div class="tabs">${['All','Verified','Pending Review','Missing TDS','Variance'].map(s=>`<button class="tab ${state.docFilter===s?'active':''}" data-doc-filter="${s}">${s}</button>`).join('')}</div><div class="card">${table(['Document no.','Type','Project','Supplier','Date','Reference value','Verification','Action'],list.map(d=>`<tr><td>${stockRecordLink(d.id,'document',d.id,{project:d.project,type:d.type})}</td><td>${d.type}</td><td>${d.project}</td><td>${d.supplier}</td><td>${d.date}</td><td>${costBreak(money(d.amount),'Document value breakdown — '+d.id,[{name:'Document reference',detail:d.id,value:money(d.amount),meta:d.type},{name:'Supplier',detail:d.supplier,value:d.project,meta:d.date}])}</td><td>${statusTag(d.status)}</td><td>${stockRecordLink('Open record','document',d.id,{project:d.project,type:d.type})}</td></tr>`))}</div><p class="muted small">MIR verification checklist: DC with gate stamp, applicable TDS and approved MSF. Actual compliance rules should be configurable by company and material type.</p>`}

${kpi('In progress',findings.filter(f=>f.status==='In Progress').length,'Corrective action underway','◉',findings.filter(f=>f.status==='In Progress').map(f=>({name:f.id,detail:f.title,value:f.owner,meta:f.project})))}

${kpi('Open exposure',money(findings.filter(f=>f.status!=='Closed').reduce((s,f)=>s+f.amount,0)),'Linked finding amounts','₹',findings.filter(f=>f.status!=='Closed').map(f=>({name:f.id,detail:f.title,value:money(f.amount),meta:f.project})),'cost')}</div><div class="tabs">${['All','Open','In Progress','Awaiting Verification','Closed'].map(s=>`<button class="tab ${state.findingFilter===s?'active':''}" data-finding-filter="${s}">${s}</button>`).join('')}</div><div class="card">${table(['Finding','Project / department','Severity','Owner','Due date','Exposure','Status','Action'],list.map(f=>`<tr><td><button class="drill" data-finding="${f.id}">${f.id}</button><div style="font-weight:650;margin-top:3px">${f.title}</div></td><td>${f.project}<div class="muted small">${f.dept}</div></td><td>${statusTag(f.severity)}</td><td>${f.owner}</td><td>${f.due}</td><td>${costBreak(money(f.amount),'Finding exposure — '+f.id,[{name:'Finding',detail:f.title,value:f.id,meta:f.project},{name:'Estimated exposure',detail:'Illustrative amount requiring review',value:money(f.amount),meta:'Not a confirmed loss'}])}</td><td>${statusTag(f.status)}</td><td><button class="btn" data-finding="${f.id}">Open</button></td></tr>`))}</div>`}

function mobilePage(){let q=questions[state.mobileQuestion%questions.length],ans=state.answers[state.mobileQuestion]||'';return head('FIELD AUDITOR','My Site Audits','Mobile-first site inspection workflow. Changes stay in this browser demo.',`<button class="btn" data-action="reset-mobile">Reset demo</button>`)+`<div class="mobilepreview"><div class="mobiletop"><div class="eyebrow" style="color:#aac5e2">AUDITFLOW · SITE AUDIT</div><h2 style="margin:5px 0 2px">Eden Heights</h2><p class="sub">Main Store · Hyderabad</p><div style="display:flex;justify-content:space-between;margin-top:15px;font-size:12px;color:#d5e4f5"><span>AUD-1024</span><span>Question ${state.mobileQuestion+1} of ${questions.length}</span></div><div class="track" style="margin-top:8px;background:#ffffff35"><div class="fill" style="width:${(state.mobileQuestion+1)/questions.length*100}%;background:#86bfff"></div></div></div><div class="mobilebody"><div class="mobilecard"><div class="eyebrow">${q.category}</div><h3 style="margin:8px 0">${q.title}</h3><p class="muted small">${q.hint}</p><div class="choice"><button class="btn ${ans==='Pass'?'selected':''}" data-answer="Pass">✓ Pass</button><button class="btn ${ans==='Fail'?'failed':''}" data-answer="Fail">✕ Fail</button><button class="btn ${ans==='N/A'?'na':''}" data-answer="N/A">N/A</button></div>${ans==='Fail'?`<div class="formgroup"><label>Observation (required for failure)</label><textarea id="mobileRemark" class="textarea" placeholder="Describe the discrepancy…">${state.answers['remark'+state.mobileQuestion]||''}</textarea><label style="margin-top:10px">Severity</label><select id="mobileSeverity" class="select" style="width:100%"><option>Medium</option><option>High</option><option>Critical</option><option>Low</option></select><button class="btn soft" style="width:100%;margin-top:10px" data-action="attach-evidence">＋ Attach photo / document</button></div>`:''}<div class="notice" style="margin-top:12px">▧ Draft saved locally for this demo. Real offline sync and secure evidence upload require backend implementation.</div><div class="mobile-actions"><button class="btn" data-action="prev-question" ${state.mobileQuestion===0?'disabled':''}>← Previous</button><button class="btn primary" data-action="next-question">${state.mobileQuestion===questions.length-1?'Review audit':'Save & continue →'}</button></div></div><div class="mobilecard"><b>Audit summary</b><div class="barrow"><div class="barlabel"><span>Answered</span>${countBreak(Object.keys(state.answers).filter(k=>!String(k).startsWith('remark')).length+' / '+questions.length,'Checklist answer summary',questions.map((q,i)=>({name:'Q'+(i+1),detail:q.title,value:state.answers[i]||'Not answered',meta:q.category})))}</div><div class="track"><div class="fill" style="width:${Object.keys(state.answers).filter(k=>!String(k).startsWith('remark')).length/questions.length*100}%"></div></div></div><button class="btn primary" style="width:100%" data-action="submit-mobile">Submit audit</button></div></div><div class="mobilebottom"><button class="active" data-go="mobile">▣<br>My audits</button><button data-go="materials">▤<br>Materials</button><button data-go="findings">⚑<br>Findings</button><button data-go="reports">▥<br>Reports</button></div></div><p class="muted small" style="text-align:center;margin-top:15px">Tip: resize the browser window to see responsive behavior.</p>`}

n></div>${table(['Name','Code','Details','Actions'],records.map((r,i)=>`<tr><td><b>${r.name}</b></td><td>${r.code||'—'}</td><td>${r.details||'—'}</td><td><button class="btn" data-master-edit="${i}">Edit</button> <button class="btn danger" data-master-delete="${i}">Delete</button></td></tr>`))}</div>`}
function masterRecordForm(index=null){let cat=state.masterCategory,old=index===null?{name:'',code:'',details:''}:masterData[cat][index];document.getElementById('modalEyebrow').textContent='MASTER DATA';document.getElementById('modalTitle').textContent=(index===null?'Add ':'Edit ')+cat+' record';document.getElementById('modalSub').textContent='Fields marked * are required';document.getElementById('modalBody').innerHTML=`<form id="masterRecordForm"><div class="formgrid"><div class="formgroup"><label>Name *</label><input class="field" style="width:100%" name="name" required value="${escMaster(old.name)}"></div><div class="formgroup"><label>Code / Reference</label><input class="field" style="width:100%" name="code" value="${escMaster(old.code||'')}"></div><div class="formgroup" style="grid-column:1/-1"><label>Details / Description</label><input class="field" style="width:100%" name="details" value="${escMaster(old.details||'')}"></div></div></form>`;document.getElementById('modalAction').textContent=index===null?'Create record':'Save changes';document.getElementById('modalAction').onclick=()=>{let f=document.getElementById('masterRecordForm');if(!f.reportValidity())return;let d=new FormData(f),rec={name:String(d.get('name')).trim(),code:String(d.get('code')).trim(),details:String(d.get('details')).trim()};if(index===null)masterData[cat].push(rec);else masterData[cat][index]=rec;document.getElementById('overlay').classList.remove('show');render();toast(index===null?'Master record created.':'Master record updated.');};document.getElementById('overlay').classList.add('show')}
function escMaster(x){return String(x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function saveMasterBulk(){let box=document.getElementById('masterBulk'),raw=box?.value||'';if(!raw.trim())return toast('Paste records or upload a CSV first.');let lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),added=0;lines.forEach((line,i)=>{let cols=line.split(',').map(x=>x.trim().replace(/^"|"$/g,''));if(i===0&&/^(name|item name|title)$/i.test(cols[0]))return;if(!cols[0])return;masterData[state.masterCategory].push({name:cols[0],code:cols[1]||'',details:cols.slice(2).filter(Boolean).join(' · ')});added++});render();toast(`${added} ${state.masterCategory} record(s) created in demo data.`)}


function transactionsPage(){
 const types=[['MR','Material Request'],['PO','Purchase Order'],['INV','Material Invoice'],['GRN','Goods Receipt Note'],['DC','Delivery Challan']];
 const type=state.transactionType||'MR',mode=state.transactionMode||'single',label=(types.find(t=>t[0]===type)||types[0])[1];
 const list=state.procurementRecords.filter(r=>r.type===type&&(!state.transactionFocusNumber||r.number===state.transactionFocusNumber));
 return head('PROCUREMENT OPERATIONS','Create Material & Purchase Records','Create Material Requests, Purchase Orders, Material Invoices, GRNs and Delivery Challans individually or in bulk.',`<button class="btn" data-action="transaction-template">Download CSV template</button>`)+
 `${state.transactionFocusNumber?`<div class="notice" style="margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;align-items:center"><span>Filtered to linked system document <b>${state.transactionFocusNumber}</b></span><button class="btn" data-clear-transaction-focus>Clear filter</button></div>`:''}<div class="card panel" style="margin-bottom:16px"><div class="panelhead"><div><h2 class="paneltitle">Choose transaction type</h2><p class="muted small">Select the document you want to create.</p></div></div><div class="tabs">${types.map(t=>`<button class="tab ${type===t[0]?'active':''}" data-transaction-type="${t[0]}">${t[1]}</button>`).join('')}</div><div class="callout"><b>${label}</b> · ${type==='MR'?'Request materials for a project.':type==='PO'?'Record an approved purchase order and supplier commitment.':type==='INV'?'Record supplier invoice details and values.':type==='GRN'?'Record quantities received against a PO/DC.':'Record delivery challan details for delivered materials.'}</div><div class="tabs"><button class="tab ${mode==='single'?'active':''}" data-transaction-mode="single">＋ Single creation</button><button class="tab ${mode==='bulk'?'active':''}" data-transaction-mode="bulk">▤ Bulk creation</button></div>
 ${mode==='single'?`<form id="transactionSingleForm"><div class="formgrid"><div class="formgroup"><label>Document number *</label><input class="field" style="width:100%" name="number" required placeholder="${type}-2026-001"></div><div class="formgroup"><label>Project *</label><select class="select" style="width:100%" name="project" required>${projects.map(p=>`<option>${p.name}</option>`).join('')}</select></div><div class="formgroup"><label>Supplier / Vendor</label><input class="field" style="width:100%" name="supplier" placeholder="Supplier name"></div><div class="formgroup"><label>Document date *</label><input class="field" style="width:100%" name="date" type="date" value="2026-10-12" required></div><div class="formgroup"><label>Item / Description *</label><input class="field" style="width:100%" name="item" required placeholder="e.g. Copper wire 2.5 sq mm"></div><div class="formgroup"><label>Quantity *</label><input class="field" style="width:100%" name="quantity" type="number" min="0.001" step="any" required value="1"></div><div class="formgroup"><label>Unit</label><select class="select" style="width:100%" name="unit"><option>Nos</option><option>m</option><option>kg</option><option>Box</option><option>Set</option><option>Litre</option></select></div><div class="formgroup"><label>Rate (₹)</label><input class="field" style="width:100%" name="rate" type="number" min="0" step="0.01" value="0"></div><div class="formgroup"><label>Reference document</label><input class="field" style="width:100%" name="reference" placeholder="PO / MR / DC reference"></div><div class="formgroup"><label>Status</label><select class="select" style="width:100%" name="status"><option>Draft</option><option>Pending Approval</option><option>Approved</option><option>Received</option><option>Under Review</option></select></div></div><div class="formgroup" style="margin-top:13px"><label>Remarks</label><textarea class="textarea" name="remarks" placeholder="Optional notes, terms or discrepancies"></textarea></div><div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn primary" type="submit">Create ${label}</button></div></form>`:
 `<div class="formgroup"><label>Bulk create · paste CSV rows (one document item per row)</label><textarea class="textarea" id="transactionBulk" rows="7" placeholder="Document Number, Project, Supplier, Date, Item, Quantity, Unit, Rate, Reference, Status\nMR-2026-001, Eden Heights, , 2026-10-12, Copper wire 2.5 sq mm, 100, m, 45, , Draft\nMR-2026-002, Siesta Residences, , 2026-10-12, PVC conduit 25 mm, 50, m, 32, , Pending Approval"></textarea><p class="muted small">Use one row per item/document line. Project name must match a project in the workspace. First row may contain column headers.</p><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:10px"><label class="btn" for="transactionFile">Upload CSV</label><input id="transactionFile" type="file" accept=".csv,text/csv" style="display:none"><button class="btn primary" data-action="transaction-bulk-save">Create bulk records</button></div></div>`}</div>
 <div class="card panel"><div class="panelhead"><div><h2 class="paneltitle">Recently created ${label} records</h2><p class="muted small">Records created in this browser demo session.</p></div><span class="tag blue">${list.length} records</span></div>${table(['Document No.','Project','Supplier','Date','Item','Qty','Rate','Amount','Reference','Status'],list.map(r=>`<tr class="${r.number===state.transactionFocusNumber?'linked-focus':''}"><td>${stockRecordLink(r.number,'document',r.number,{project:r.project,type:r.type})}</td><td>${r.project}</td><td>${r.supplier||'—'}</td><td>${r.date||'—'}</td><td>${r.item}</td><td>${r.quantity} ${r.unit||''}</td><td>${money(r.rate||0)}</td><td><b>${money((Number(r.quantity)||0)*(Number(r.rate)||0))}</b></td><td>${r.reference||'—'}</td><td>${statusTag(r.status||'Draft')}</td></tr>`))}</div><p class="notice" style="margin-top:14px">Prototype only: created records are held in browser memory and are not submitted to your ERP or a database. Validate approvals, duplicate document numbers, tax, permissions and stock/accounting effects on the server before production use.</p>`
}
function saveTransactionSingle(e){e.preventDefault();const form=e.target;if(!form.reportValidity())return;const d=new FormData(form);const rec={type:state.transactionType,number:String(d.get('number')).trim(),project:d.get('project'),supplier:d.get('supplier'),date:d.get('date'),item:d.get('item'),quantity:Number(d.get('quantity'))||0,unit:d.get('unit'),rate:Number(d.get('rate'))||0,reference:d.get('reference'),status:d.get('status'),remarks:d.get('remarks')};if(state.procurementRecords.some(r=>r.type===rec.type&&r.number.toLowerCase()===rec.number.toLowerCase()))return toast('This document number already exists for this transaction type.');state.procurementRecords.unshift(rec);render();toast(`${rec.type} ${rec.number} created in demo data.`)}
function saveTransactionBulk(){const box=document.getElementById('transactionBulk'),raw=box?.value||'';if(!raw.trim())return toast('Paste or upload CSV rows first.');const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let added=0,skipped=0;lines.forEach((line,i)=>{const c=line.split(',').map(x=>x.trim().replace(/^"|"$/g,''));if(i===0&&/document number|^number$/i.test(c[0]))return;if(c.length<6||!c[0]||!c[1]||!c[4]||!(Number(c[5])>0)){skipped++;return}if(!projects.some(p=>p.name.toLowerCase()===c[1].toLowerCase())){skipped++;return}if(state.procurementRecords.some(r=>r.type===state.transactionType&&r.number.toLowerCase()===c[0].toLowerCase())){skipped++;return}state.procurementRecords.unshift({type:state.transactionType,number:c[0],project:c[1],supplier:c[2]||'',date:c[3]||'',item:c[4],quantity:Number(c[5]),unit:c[6]||'Nos',rate:Number(c[7])||0,reference:c[8]||'',status:c[9]||'Draft',remarks:''});added++});render();toast(`${added} record(s) created; ${skipped} row(s) skipped. Check required columns, project names and duplicate numbers.`)}


const indentApprovalRoles=[
 {key:'supervisor',label:'Site Supervisor'},
 {key:'engineer',label:'Engineer'}
];
function projectStock(){return stock}
function materialIndents(){return state.indents||(state.indents=[])}
function ensureWorkflow(r){
 if(!r.approvals)r.approvals={};
 if(!Object.prototype.hasOwnProperty.call(r.approvals,'supervisor'))r.approvals.supervisor=null;
 if(!Object.prototype.hasOwnProperty.call(r.approvals,'engineer'))r.approvals.engineer=null;
 if(!r.workflow)r.workflow={};
 const defs={
  storeIssue:{assignee:'Store In-charge',completed:false,photoNames:[]},
  subcontractorWork:{assignee:r.requestedBy||'Worker / Subcontractor',completed:false,photoNames:[]},
  supervisorReview:{assignee:'Site Supervisor',completed:false,photoNames:[]},
  engineerChecklist:{assignee:'Engineer',completed:false,photoNames:[]},
  siteJMR:{assignee:'Site In-charge',completed:false,photoNames:[]},
  billing:{assignee:'Billing Engineer',completed:false,photoNames:[]}
 };
 for(const [key,def] of Object.entries(defs)){
  if(!r.workflow[key])r.workflow[key]={...def};
  else {r.workflow[key].assignee ||= def.assignee;r.workflow[key].photoNames ||= [];if(typeof r.workflow[key].completed!=='boolean')r.workflow[key].completed=false;}
 }
 refreshWorkflow(r);return r.workflow;
}
function indentApprovalComplete(r){ensureWorkflowShallow(r);return indentApprovalRoles.every(role=>!!r.approvals?.[role.key])}
function ensureWorkflowShallow(r){r.tower ||= 'Tower A';if(!r.approvals)r.approvals={};if(!Object.prototype.hasOwnProperty.call(r.approvals,'supervisor'))r.approvals.supervisor=null;if(!Object.prototype.hasOwnProperty.call(r.approvals,'engineer'))r.approvals.engineer=null;if(!r.workflow)r.workflow={};}
function refreshWorkflow(r){
 ensureWorkflowShallow(r);
 if(!r.workflow.storeIssue)r.workflow.storeIssue={assignee:'Store In-charge',completed:false,photoNames:[]};
 if(!r.workflow.subcontractorWork)r.workflow.subcontractorWork={assignee:r.requestedBy||'Worker / Subcontractor',completed:false,photoNames:[]};
 if(!r.workflow.supervisorReview)r.workflow.supervisorReview={assignee:'Site Supervisor',completed:false,photoNames:[]};
 if(!r.workflow.engineerChecklist)r.workflow.engineerChecklist={assignee:'Engineer',completed:false,photoNames:[]};
 if(!r.workflow.siteJMR)r.workflow.siteJMR={assignee:'Site In-charge',completed:false,photoNames:[]};
 if(!r.workflow.billing)r.workflow.billing={assignee:'Billing Engineer',completed:false,photoNames:[]};
 const w=r.workflow,approved=indentApprovalRoles.every(role=>!!r.approvals[role.key]);
 const rules={storeIssue:approved,subcontractorWork:!!w.storeIssue.completed,supervisorReview:!!w.subcontractorWork.completed,engineerChecklist:!!w.supervisorReview.completed,siteJMR:!!w.engineerChecklist.completed,billing:!!w.engineerChecklist.completed};
 for(const [key,unlocked] of Object.entries(rules))w[key].status=w[key].completed?'done':unlocked?'pending':'blocked';
 return w;
}
function reservedForIndents(s){return materialIndents().filter(r=>r.project===s.project&&r.stockCode===s.code&&!r.materialIssued&&r.status!=='Issued'&&r.status!=='Cancelled').reduce((a,r)=>a+(Number(r.qty)||0),0)}
function availableStock(s){return Math.max(0,(Number(s.physical)||0)-reservedForIndents(s))}
function recalcStock(s){s.expected=(Number(s.opening)||0)+(Number(s.received)||0)-(Number(s.issued)||0)+(Number(s.returns)||0);s.variance=(Number(s.physical)||0)-s.expected;s.value=Math.abs(s.variance)*(Number(s.rate)||0)}
function taskStatusTag(status){const map={done:['green','Completed'],pending:['blue','Task assigned'],blocked:['gray','Locked']};const v=map[status]||['gray',status||'Pending'];return `<span class="tag ${v[0]}">${v[1]}</span>`}
function indentStatus(r){ensureWorkflow(r);const w=r.workflow;if(w.billing.completed&&!w.siteJMR.completed)return '<span class="tag high">Billed · JMR pending</span>';if(w.billing.completed&&w.siteJMR.completed)return '<span class="tag green">Billing & JMR done</span>';if(w.engineerChecklist.completed)return '<span class="tag blue">JMR + Billing tasks</span>';if(r.materialIssued)return '<span class="tag blue">Work in Progress</span>';if(indentApprovalComplete(r))return '<span class="tag blue">Approved · Store Issue Task</span>';return '<span class="tag high">Pending Approval</span>'}
function workflowStepClass(task){return task.completed?'done':task.status==='pending'?'pending':'blocked'}
function photoControl(r,key,label){const photos=r.workflow?.[key]?.photoNames||[];return `<div class="wf-controls"><label class="btn" style="cursor:pointer">＋ Upload ${label} photos<input class="photo-picker" type="file" accept="image/*" multiple data-task-photos="${key}|${r.id}" style="display:block;margin-top:6px"></label><span class="photo-selection-status" data-photo-status="${key}|${r.id}">${photos.length?`${photos.length} photo(s) selected: ${photos.join(', ')}`:'No photos selected'}</span></div>`}
function renderWorkflowStep(r,number,key,title,description,actionHtml=''){
 const w=r.workflow[key];return `<div class="wf-step ${workflowStepClass(w)}"><div class="wf-num">${number}</div><div class="wf-stepbody"><strong>${title}</strong><p>${description}</p>${w.completed?`<p style="margin-top:5px;color:#147357">Completed by ${w.completedBy||w.assignee||'Assigned user'}${w.completedAt?` · ${w.completedAt}`:''}${w.reference?` · Ref: ${w.reference}`:''}</p>`:''}${w.note?`<p style="margin-top:4px">${w.note}</p>`:''}${actionHtml}</div>${taskStatusTag(w.status)}</div>`;
}
function taskAction(r,key,label){const w=r.workflow[key];if(w.status!=='pending')return '';if(key==='subcontractorWork')return photoControl(r,key,'work')+`<div class="wf-controls"><button class="btn primary" data-workflow-task="${r.id}|${key}">Complete work & submit photos</button></div>`;if(key==='supervisorReview')return photoControl(r,key,'review')+`<div class="wf-controls"><button class="btn primary" data-workflow-task="${r.id}|${key}">Complete review & submit photos</button></div>`;return `<div class="wf-controls"><button class="btn primary" data-workflow-task="${r.id}|${key}">${label}</button></div>`}
function approvalLine(r,role,index){const v=r.approvals?.[role.key];if(v)return `<span class="tag green">Approved</span><div class="muted small" style="margin-top:4px">${v.by}${v.at?` · ${v.at}`:''}</div>`;const canApprove=index===0||!!r.approvals?.[indentApprovalRoles[index-1]?.key];return canApprove?`<button class="btn soft" data-indent-approve="${r.id}|${role.key}">Approve as ${role.label}</button>`:`<span class="muted small">Awaiting Site Supervisor</span>`}
function workflowCard(r){ensureWorkflow(r);const w=r.workflow;const approvalsDone=indentApprovalComplete(r);
 const approvalStep=`<div class="wf-step ${approvalsDone?'done':r.approvals.supervisor?'pending':'pending'}"><div class="wf-num">2</div><div class="wf-stepbody"><strong>Supervisor and Engineer approval</strong><p>Both approvals are required before the Store In-charge task is assigned.</p><div class="wf-controls"><div><b class="small">Site Supervisor</b><div style="margin-top:5px">${approvalLine(r,indentApprovalRoles[0],0)}</div></div><div><b class="small">Engineer</b><div style="margin-top:5px">${approvalLine(r,indentApprovalRoles[1],1)}</div></div></div></div>${approvalsDone?'<span class="tag green">Approved</span>':'<span class="tag high">Approval pending</span>'}</div>`;
 let steps='';
 steps+=`<div class="wf-step done"><div class="wf-num">1</div><div class="wf-stepbody"><strong>Indent raised · ${r.requesterType}: ${r.requestedBy}</strong><p>${r.item} · Requested ${num(r.qty)} ${r.unit} · ${r.project}${r.remarks?` · ${r.remarks}`:''}</p></div><span class="tag green">Submitted</span></div>`;
 steps+=approvalStep;
 steps+=renderWorkflowStep(r,3,'storeIssue','Store In-charge: prepare, pack and issue material',`Pick and pack ${num(r.qty)} ${r.unit} of ${r.item}; keep it ready for collection. Complete this task when the issue is recorded.`,taskAction(r,'storeIssue','Complete store issue task'));
 steps+=renderWorkflowStep(r,4,'subcontractorWork','Worker / Subcontractor: complete the work',`Assigned to ${r.requestedBy}. Complete the related work and attach work photos.`,taskAction(r,'subcontractorWork','Complete work & submit photos'));
 steps+=renderWorkflowStep(r,5,'supervisorReview','Site Supervisor: review completed work',`Inspect the completed work and attach review photos as evidence.`,taskAction(r,'supervisorReview','Complete review & submit photos'));
 steps+=renderWorkflowStep(r,6,'engineerChecklist','Engineer: prepare checklist and obtain Client approval','Prepare the work checklist and record the Client approval reference.',taskAction(r,'engineerChecklist','Complete checklist & Client approval'));
 const jmr=renderWorkflowStep(r,7,'siteJMR','Site In-charge: obtain JMR from Client Billing','This task runs independently from Billing Engineer billing after the Engineer checklist is approved.',taskAction(r,'siteJMR','Record JMR received'));
 let billDesc='Prepare the bill for the completed work after checklist / Client approval. You do not have to wait for the JMR task to finish.';if(w.billing.completed&&w.billing.billedBeforeJMR)billDesc='Bill completed before the JMR task was finished. The JMR task remains open and can be completed separately.';
 const billing=renderWorkflowStep(r,8,'billing','Billing Engineer: prepare billing',billDesc,taskAction(r,'billing','Record billing completed'));

function newFinding(){document.getElementById('modalTitle').textContent='Create finding';document.getElementById('modalEyebrow').textContent='ISSUE MANAGEMENT';document.getElementById('modalSub').textContent='Record a discrepancy and assign an owner';document.getElementById('modalBody').innerHTML=`<form id="newFindingForm"><div class="formgrid"><div class="formgroup"><label>Title *</label><input class="field" style="width:100%" name="title" required></div><div class="formgroup"><label>Project *</label><select class="select" name="project">${projects.map(p=>`<option>${p.name}</option>`).join('')}</select></div><div class="formgroup"><label>Department</label><select class="select" name="dept"><option>Store</option><option>Purchase</option><option>Accounts</option><option>Project</option></select></div><div class="formgroup"><label>Severity</label><select class="select" name="severity"><option>Medium</option><option>High</option><option>Critical</option><option>Low</option></select></div><div class="formgroup"><label>Owner</label><select class="select" name="owner"><option>Store In-charge</option><option>Purchase Team</option><option>Accounts Team</option><option>Project In-charge</option></select></div><div class="formgroup"><label>Due date</label><input class="field" style="width:100%" name="due" value="20 Oct 2026"></div><div class="formgroup"><label>Estimated exposure (₹)</label><input class="field" style="width:100%" name="amount" type="number" min="0" value="0"></div></div><div class="formgroup" style="margin-top:13px"><label>Description *</label><textarea class="textarea" name="desc" required></textarea></div></form>`;document.getElementById('modalAction').textContent='Create demo finding';document.getElementById('modalAction').onclick=()=>{let form=document.getElementById('newFindingForm');if(!form.reportValidity())return;let d=new FormData(form);findings.unshift({id:'F-'+String(8+findings.length).padStart(3,'0'),title:d.get('title'),project:d.get('project'),de function handleAction(a){if(a==='transaction-bulk-save')return saveTransactionBulk();if(a==='transaction-template'){let csv='Document Number,Project,Supplier,Date,Item,Quantity,Unit,Rate,Reference,Status\n';let blob=new Blob([csv],{type:'text/csv'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=(state.transactionType||'MR')+'-bulk-template.csv';link.click();URL.revokeObjectURL(url);return}if(a==='master-add')return masterRecordForm();if(a==='master-bulk-save')return saveMasterBulk();if(a==='master-template'){let csv='Name,Code,Details\n';let blob=new Blob([csv],{type:'text/csv'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='master-data-template.csv';a.click();URL.revokeObjectURL(url);return}if(a==='add-ra'){let p=projects.find(x=>x.name===state.selectedProject)||projects[0],bills=ensureBills(p.name),id='RA-'+String(bills.length+1).padStart(2,'0');bills.push({id,date:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),basic:0,mobilisation:0,sgst:0,cgst:0,deductions:{},accountsReceived:0,bankReceived:0});state.selectedRA=id;render();return toast('New RA bill added. Enter amounts and save.')}if(a==='add-custom-addition'){let label=prompt('Enter new addition field name:');if(!label||!label.trim())return;let key='customAddition'+Date.now();state.customAdditions.push({key,label:label.trim()});render();return toast('Addition field created.')}if(a==='add-custom-deduction'){let label=prompt('Enter new deduction field name:');if(!label||!label.trim())return;let key='customDeduction'+Date.now();state.customDeductions.push({key,label:label.trim()});let p=projects.find(x=>x.name===state.selectedProject)||projects[0],b=ensureBills(p.name).find(x=>x.id===state.selectedRA);if(b){b.deductions=b.deductions||{};b.deductions[key]=0}render();return toast('Deduction field created.')}if(a==='save-ra'){render();return toast('RA bill saved in this browser session.')}if(a==='new-audit')return newAudit();if(a==='new-finding')return newFinding();if(a==='new-project')return toast('Project creation form is planned for the next prototype iteration.');if(a==='reset-mobile'){state.mobileQuestion=0;state.answers={};render();return toast('Mobile demo reset.')}if(a==='prev-question'){state.mobileQuestion=Math.max(0,state.mobileQuestion-1);render();return}if(a==='next-question'){if(!state.answers[state.mobileQuestion])return toast('Select Pass, Fail or N/A before continuing.');if(state.answers[state.mobileQuestion]==='Fail'&&!String(state.answers['remark'+state.mobileQuestion]||'').trim())return toast('Add an observation for a failed check.');if(state.mobileQuestion<questions.length-1){state.mobileQuestion++;render()}else{toast('Checklist reviewed. Submit the audit when ready.')}return}if(a==='submit-mobile'){let unanswered=questions.findIndex((q,i)=>!state.answers[i]);if(unanswered>=0){state.mobileQuestion=unanswered;render();return toast('Complete all checklist questions before submission.')}if(questions.some((q,i)=>state.answers[i]==='Fail'&&!String(state.answers['remark'+i]||'').trim()))return toast('Add observations for failed questions.');toast('Demo audit submitted locally. Production submission requires API validation and server-side audit history.');return}if(a==='attach-evidence')return toast('Evidence upload is a UI placeholder; secure file upload is not connected.');if(a==='audit-calendar')return toast('Calendar view is planned; the audit register is available now.');if(a==='material-export'||a==='finding-export'||a==='report-export')return toast('Export is a placeholder in this prototype; connect a report/export service in the next stage.');if(a==='document-check')return toast('Document verification editor is planned for the next iteration.');if(a==='document-import')return toast('CSV/XLSX import is not connected in this prototype.');if(a==='invite-user')return toast('User invitations require the authentication and email services.');if(a==='template-edit')return toast('Template editor will be added after the workflow rules are finalized.')}
function openStockLinkedRecord(kind,encodedId,encodedProject='',encodedCode='',encodedType='',encodedItem=''){
 const decode=v=>{try{return decodeURIComponent(v||'')}catch(_){return v||''}};
 const id=decode(encodedId),project=decode(encodedProject),code=decode(encodedCode),type=decode(encodedType),item=decode(encodedItem);
 state.stockDocumentFocus=null;
 if(kind==='issue'){
  const issue=stockIssues.find(m=>m.id===id);if(!issue)return toast('Linked issue record was not found.');
  state.storeStockFilter={code:issue.code,item:issue.item};state.storeStockTab='issued';state.stockIssueFocus=issue.id;state.stockIndentFocus=null;state.selectedProject=issue.project;state.page='siteWorkflow';render();return;
 }
 if(kind==='indent'){
  const indent=materialIndents().find(r=>r.id===id);
  if(indent){state.storeStockFilter={code:indent.stockCode,item:indent.item};state.storeStockTab='indents';state.stockIndentFocus=indent.id;state.stockIssueFocus=null;state.selectedProject=indent.project;state.page='siteWorkflow';render();return;}
  const hist=stockIssues.find(m=>m.indent===id);
  if(hist){state.storeStockFilter={code:hist.code,item:hist.item};state.storeStockTab='issued';state.stockIssueFocus=hist.id;state.stockIndentFocus=null;state.selectedProject=hist.project;state.page='siteWorkflow';render();return;}
  state.stockDocumentFocus={kind:'document',id,project,code,type:type||'Material Indent',item};state.page='siteWorkflow';render();return;
 }
 if(kind==='attachment'){
  const issue=stockIssues.find(m=>m.id===id),indent=materialIndents().find(r=>r.id===id);
  if(issue){const attachment=state.issueAttachments[id];if(attachment?.url){window.open(attachment.url,'_blank','noopener');return;}state.stockDocumentFocus={kind:'attachment',id:issue.signedRef||`SIGNED-${issue.id}`,issueId:id,project:issue.project,code:issue.code,item:issue.item,type:issue.sourceType||'Physical / signed issue copy'};state.page='siteWorkflow';render();return;}
  if(indent){const attachment=state.indentAttachments[id];if(attachment?.url){window.open(attachment.url,'_blank','noopener');return;}state.stockDocumentFocus={kind:'attachment',id:indent.signedRef||`SIGNED-${indent.id}`,indentId:id,project:indent.project,code:indent.stockCode,item:indent.item,type:'Physical / signed Indent'};state.page='siteWorkflow';render();return;}
  const historic=stockIssues.find(m=>m.indent===id);if(historic){state.stockDocumentFocus={kind:'attachment',id:`SIGNED-${id}`,issueId:historic.id,project:historic.project,code:historic.code,item:historic.item,type:'Physical / signed historical Indent reference'};state.page='siteWorkflow';render();return;}
  state.stockDocumentFocus={kind:'attachment',id:`SIGNED-${id}`,project,code,item,type:type||'Physical / signed document'};state.page='siteWorkflow';render();return;
 }
 if(kind==='document'){
  const systemRecord=state.procurementRecords.find(r=>r.number===id&&(!project||r.project===project));
  const document=docs.find(d=>d.id===id&&(!project||d.project===project));
  if(systemRecord&&roleProfiles[state.activeRole]?.pages.includes('transactions')){state.transactionType=systemRecord.type;state.transactionMode='single';state.transactionFocusNumber=id;state.stockDocumentFocus=null;state.page='transactions';render();return;}
  if(document&&roleProfiles[state.activeRole]?.pages.includes('documents')){state.docFocusId=id;state.stockDocumentFocus=null;state.page='documents';render();return;}
  state.stockDocumentFocus={kind:'document',id,project,code,type,item};state.page='siteWorkflow';render();return;
 }
 toast('This link type is not supported.');
}

 tm=e.target.closest('[data-transaction-mode]');if(tm){state.transactionMode=tm.dataset.transactionMode;render();return}let mc=e.target.closest('[data-master-category]');if(mc){state.masterCategory=mc.dataset.masterCategory;render();return}let me=e.target.closest('[data-master-edit]');if(me){masterRecordForm(Number(me.dataset.masterEdit));return}let md=e.target.closest('[data-master-delete]');if(md){let ix=Number(md.dataset.masterDelete);if(confirm('Delete this master record?')){masterData[state.masterCategory].splice(ix,1);render();toast('Master record deleted from demo data.')}return}let nav=e.target.closest('[data-page]');if(nav){showPage(nav.dataset.page);return}let go=e.target.closest('[data-go]');if(go){showPage(go.dataset.go);if(go.dataset.action)handleAction(go.dataset.action);return}let metric=e.target.closest('[data-metric]');if(metric){let id=metric.dataset.metric;if(id==='contract'){showPage('projects')}else{state.financialMetric=id;showPage('finance')}return}let projectOpen=e.target.closest('[data-project-open]');if(projectOpen){state.selectedProject=projectOpen.dataset.projectOpen;showPage('projectDashboard');return}let d=e.target.closest('[data-drill]');if(d){try{openBreakdown(JSON.parse(decodeURIComponent(d.dataset.drill)))}catch(err){toast('Could not open breakdown.')}return}let af=e.target.closest('[data-audit-filter]');if(af){state.auditFilter=af.dataset.auditFilter;render();return}let ff=e.target.closest('[data-finding-filter]');if(ff){state.findingFilter=ff.dataset.findingFilter;render();return}let df=e.target.closest('[data-doc-filter]');if(df){state.docFilter=df.dataset.docFilter;render();return}let audit=e.target.closest('[data-audit]');if(audit){showAudit(audit.dataset.audit);return}let finding=e.target.closest('[data-finding]');if(finding){showFinding(finding.dataset.finding);return}let doc=e.target.closest('[data-doc]');if(doc){showDoc(doc.dataset.doc);return}let st=e.target.closest('[data-stock]');if(st){stockInspect(st.dataset.stock);return}let ans=e.target.closest('[data-answer]');if(ans){state.answers[state.mobileQuestion]=ans.dataset.answer;render();return}let ra=e.target.closest('[data-select-ra]');if(ra){state.selectedRA=ra.dataset.selectRa;render();return}let delField=e.target.closest('[data-delete-field]');if(delField){let [kind,key]=delField.dataset.deleteField.split(':');if(kind==='addition'){additionFields.splice(additionFields.findIndex(f=>f.key===key),1)}else{deductionFields.splice(deductionFields.findIndex(f=>f.key===key),1)}render();toast('Field deleted from this prototype configuration.');return}let delCustom=e.target.closest('[data-delete-custom]');if(delCustom){let [kind,ix]=delCustom.dataset.deleteCustom.split(':');if(kind==='addition')state.customAdditions.splice(Number(ix),1);else state.customDeductions.splice(Number(ix),1);render();return}let action=e.target.closest('[data-action]');if(action){handleAction(action.dataset.action);return}});
